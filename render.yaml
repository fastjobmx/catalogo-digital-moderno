# Backend y paneles en Render. La base catalogo-db se crea aparte en el plan gratis.
services:
  - type: web
    name: catalogo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: VITE_MERCUR_BACKEND_URL=$RENDER_EXTERNAL_URL npx bun install && VITE_MERCUR_BACKEND_URL=$RENDER_EXTERNAL_URL npx turbo run build --filter=!@acme/storefront
    startCommand: node tools/start-production.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=420
      - key: MERCUR_DISABLE_TELEMETRY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: catalogo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Contraseñas de los usuarios sembrados: se ven en Environment, no en el repositorio.
      - key: SEED_SELLER_PASSWORD
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@catalogo.test
      - key: STOREFRONT_URL
        value: https://catalogo-digital-moderno.vercel.app
      - key: SEED_ASSET_BASE_URL
        value: https://catalogo-digital-moderno.vercel.app
      - key: PLATFORM_COMMISSION_PERCENT
        value: "3"
